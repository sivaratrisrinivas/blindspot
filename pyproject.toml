[project]
name = "blindspot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.4.0",
    "httpx>=0.28.1",
    "neatlogs>=1.4.21",
    "openai>=3.8.0",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
]

[project.scripts]
blindspot = "blindspot.cli:main"

[tool.setuptools.packages.find]
include = ["blindspot*", "targets*"]
