<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 980" width="1080" height="980" role="img" aria-label="Blindspot pipeline. A seed corpus feeds a mutator, the mutant runs against the target agent, and the run is hashed into a behaviour signature; a novel signature sends the input back to the corpus as a new seed. The run then passes through four oracles: crash, schema, metamorphic and judge. Findings are clustered and ranked, shrunk by delta debugging, and emitted as a pytest file and as one Agent Orchestrator worker per failure class. An optional LLM provider lane touches only two points, semantic mutation and the judge oracle."><title>Blindspot pipeline. A seed corpus feeds a mutator, the mutant runs against the target agent, and the run is hashed into a behaviour signature; a novel signature sends the input back to the corpus as a new seed. The run then passes through four oracles: crash, schema, metamorphic and judge. Findings are clustered and ranked, shrunk by delta debugging, and emitted as a pytest file and as one Agent Orchestrator worker per failure class. An optional LLM provider lane touches only two points, semantic mutation and the judge oracle.</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c3cad4"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e0a343"/></marker></defs><rect width="1080" height="980" fill="#161b24"/><g font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace"><text x="280" y="62" font-size="11" fill="#99a3b1" letter-spacing="1.4">DETERMINISTIC CRITICAL PATH</text><text x="700" y="286" font-size="11" fill="#e0a343" letter-spacing="1.4">OPTIONAL LLM LANE</text><path d="M 280 399 L 210 399 L 210 105 L 276 105" fill="none" stroke="#99a3b1" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="196" y="236" font-size="11" fill="#99a3b1" text-anchor="end">novel signature,</text><text x="196" y="252" font-size="11" fill="#99a3b1" text-anchor="end">keep this input</text><text x="196" y="268" font-size="11" fill="#99a3b1" text-anchor="end">as a new seed</text><rect x="280" y="76" width="320" height="58" rx="2" fill="none" stroke="#c3cad4" stroke-width="1.2"/><text x="302" y="101" font-size="14.5" fill="#e5e9ef" font-weight="600">Seed corpus</text><text x="302" y="120" font-size="11" fill="#99a3b1">round-robin, dedup by signature</text><rect x="280" y="174" width="320" height="58" rx="2" fill="none" stroke="#c3cad4" stroke-width="1.2"/><text x="302" y="199" font-size="14.5" fill="#e5e9ef" font-weight="600">Mutator</text><text x="302" y="218" font-size="11" fill="#99a3b1">7 answer-preserving ops, 2 destructive</text><rect x="280" y="272" width="320" height="58" rx="2" fill="none" stroke="#c3cad4" stroke-width="1.2"/><text x="302" y="297" font-size="14.5" fill="#e5e9ef" font-weight="600">Target agent</text><text x="302" y="316" font-size="11" fill="#99a3b1">spec.entrypoint, SIGALRM hang guard</text><rect x="280" y="370" width="320" height="58" rx="2" fill="none" stroke="#c3cad4" stroke-width="1.2"/><text x="302" y="395" font-size="14.5" fill="#e5e9ef" font-weight="600">Behaviour signature</text><text x="302" y="414" font-size="11" fill="#99a3b1">SHA-1 of tool shapes, terminal, retries</text><rect x="280" y="676" width="320" height="58" rx="2" fill="none" stroke="#c3cad4" stroke-width="1.2"/><text x="302" y="701" font-size="14.5" fill="#e5e9ef" font-weight="600">Cluster and rank</text><text x="302" y="720" font-size="11" fill="#99a3b1">group by (oracle, signature), score</text><rect x="280" y="774" width="320" height="58" rx="2" fill="none" stroke="#c3cad4" stroke-width="1.2"/><text x="302" y="799" font-size="14.5" fill="#e5e9ef" font-weight="600">Delta debugger</text><text x="302" y="818" font-size="11" fill="#99a3b1">ddmin, transform replayed each round</text><rect x="280" y="476" width="320" height="166" rx="2" fill="none" stroke="#c3cad4" stroke-width="1.2"/><text x="302" y="501" font-size="14.5" fill="#e5e9ef" font-weight="600">Oracle stack</text><rect x="294" y="510" width="292" height="24" rx="2" fill="#1f2632" stroke="#1f2632" stroke-width="1.2"/><text x="302" y="526" font-size="11.5" fill="#e5e9ef" font-weight="600">crash</text><text x="578" y="526" font-size="11.5" fill="#99a3b1" text-anchor="end">error, timeout, retry loop</text><rect x="294" y="537" width="292" height="24" rx="2" fill="#1f2632" stroke="#1f2632" stroke-width="1.2"/><text x="302" y="553" font-size="11.5" fill="#e5e9ef" font-weight="600">schema</text><text x="578" y="553" font-size="11.5" fill="#99a3b1" text-anchor="end">contract(output) is False</text><rect x="294" y="564" width="292" height="24" rx="2" fill="#1f2632" stroke="#1f2632" stroke-width="1.2"/><text x="302" y="580" font-size="11.5" fill="#e5e9ef" font-weight="600">metamorphic</text><text x="578" y="580" font-size="11.5" fill="#99a3b1" text-anchor="end">GL 1100 to 6000 on a rename</text><rect x="294" y="591" width="292" height="24" rx="2" fill="none" stroke="#e0a343" stroke-width="1.2" stroke-dasharray="4 3"/><text x="302" y="607" font-size="11.5" fill="#e5e9ef" font-weight="600">judge</text><text x="578" y="607" font-size="11.5" fill="#99a3b1" text-anchor="end">budgeted, last resort</text><text x="302" y="630" font-size="10.5" fill="#99a3b1">a deterministic oracle fires, the judge is skipped</text><rect x="280" y="872" width="152" height="64" rx="2" fill="none" stroke="#c3cad4" stroke-width="1.2"/><text x="294" y="897" font-size="13" fill="#e5e9ef" font-weight="600">pytest file</text><text x="294" y="915" font-size="10.5" fill="#99a3b1">one test per</text><text x="294" y="928" font-size="10.5" fill="#99a3b1">failure class</text><rect x="448" y="872" width="152" height="64" rx="2" fill="none" stroke="#c3cad4" stroke-width="1.2"/><text x="462" y="897" font-size="13" fill="#e5e9ef" font-weight="600">AO workers</text><text x="462" y="915" font-size="10.5" fill="#99a3b1">one fix PR per</text><text x="462" y="928" font-size="10.5" fill="#99a3b1">failure class</text><path d="M 440 134 L 440 170" fill="none" stroke="#c3cad4" stroke-width="1.4" marker-end="url(#ah)"/><text x="452" y="156" font-size="11.5" fill="#99a3b1">seed</text><path d="M 440 232 L 440 268" fill="none" stroke="#c3cad4" stroke-width="1.4" marker-end="url(#ah)"/><text x="452" y="254" font-size="11.5" fill="#99a3b1">mutant</text><path d="M 440 330 L 440 366" fill="none" stroke="#c3cad4" stroke-width="1.4" marker-end="url(#ah)"/><text x="452" y="352" font-size="11.5" fill="#99a3b1">AgentRun</text><path d="M 440 428 L 440 472" fill="none" stroke="#c3cad4" stroke-width="1.4" marker-end="url(#ah)"/><text x="452" y="454" font-size="11.5" fill="#99a3b1">run plus cached baseline</text><path d="M 440 642 L 440 672" fill="none" stroke="#c3cad4" stroke-width="1.4" marker-end="url(#ah)"/><text x="452" y="661" font-size="11.5" fill="#99a3b1">findings</text><path d="M 440 734 L 440 770" fill="none" stroke="#c3cad4" stroke-width="1.4" marker-end="url(#ah)"/><text x="452" y="756" font-size="11.5" fill="#99a3b1">ranked classes</text><path d="M 440 832 L 440 852 L 356 852 L 356 868" fill="none" stroke="#c3cad4" stroke-width="1.4" marker-end="url(#ah)"/><path d="M 440 832 L 440 852 L 524 852 L 524 868" fill="none" stroke="#c3cad4" stroke-width="1.4" marker-end="url(#ah)"/><text x="452" y="846" font-size="11.5" fill="#99a3b1">minimal repro</text><rect x="700" y="300" width="340" height="170" rx="2" fill="none" stroke="#e0a343" stroke-width="1.2" stroke-dasharray="5 4"/><text x="720" y="330" font-size="14.5" fill="#e5e9ef" font-weight="600">Provider table</text><text x="720" y="349" font-size="11" fill="#99a3b1">blindspot/llm.py, one row per API</text><text x="720" y="382" font-size="11.5" fill="#e5e9ef" font-weight="600">groq</text><text x="1020" y="382" font-size="11.5" fill="#99a3b1" text-anchor="end">gpt-oss-20b / 120b</text><text x="720" y="404" font-size="10.5" fill="#99a3b1">priced, reports dollars</text><text x="720" y="432" font-size="11.5" fill="#e5e9ef" font-weight="600">tensormux</text><text x="1020" y="432" font-size="11.5" fill="#99a3b1" text-anchor="end">glm-4-7-flash</text><text x="720" y="454" font-size="10.5" fill="#99a3b1">no published price, reports call count</text><path d="M 700 340 L 650 340 L 650 203 L 604 203" fill="none" stroke="#e0a343" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah-a)"/><text x="650" y="195" font-size="10" fill="#e0a343" text-anchor="middle">semantic mutation</text><path d="M 700 440 L 650 440 L 650 603 L 604 603" fill="none" stroke="#e0a343" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah-a)"/><text x="650" y="617" font-size="10" fill="#e0a343" text-anchor="middle">judge verdict</text><text x="700" y="500" font-size="11.5" fill="#99a3b1">Delete this lane and the loop still proves</text><text x="700" y="518" font-size="11.5" fill="#99a3b1">every crash, schema and metamorphic class.</text></g></svg>
